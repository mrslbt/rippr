<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>rippr — YouTube Video Summarizer</title>
  <meta name="description" content="Paste a YouTube URL, get an AI-powered summary with key points. Fast, free, mobile-friendly.">
  <meta name="theme-color" content="#0a0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #7ecbaa;
      --mint-glow: rgba(126,203,170,0.4);
      --mint-subtle: rgba(126,203,170,0.08);
      --bg-deep: #0a0d12;
      --bg-base: #0d1117;
      --bg-raised: #141a22;
      --border-subtle: rgba(126,203,170,0.08);
      --border-active: rgba(126,203,170,0.2);
      --text-primary: #e6edf3;
      --text-secondary: #7d8590;
      --text-muted: #484f58;
      --red: #f85149;
      --green: #3fb950;
      --ease: cubic-bezier(0.16,1,0.3,1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .crt {
      position: fixed; inset: 0; pointer-events: none; z-index: 100;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }

    .glow {
      position: fixed; top: -40%; left: -20%; width: 140%; height: 80%;
      background: radial-gradient(ellipse at 50% 0%, rgba(126,203,170,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

    .app {
      position: relative; z-index: 1;
      max-width: 480px; margin: 0 auto;
      padding: 24px 20px env(safe-area-inset-bottom, 20px);
      display: flex; flex-direction: column; gap: 18px;
      min-height: 100dvh;
    }

    /* ── Header ── */
    .header { display: flex; align-items: center; gap: 14px; }

    .logo {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-raised), var(--bg-base));
      border: 1px solid var(--border-active);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
      animation: bob 4s ease-in-out infinite;
    }

    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

    .brand h1 {
      font-family: 'Silkscreen', cursive; font-size: 26px; font-weight: 700;
      letter-spacing: 1px; line-height: 1;
      text-shadow: 0 0 30px rgba(126,203,170,0.15);
    }

    .brand .tag {
      font-size: 9px; letter-spacing: 3px; color: var(--text-muted);
      text-transform: uppercase; margin-top: 4px;
    }

    /* ── Input ── */
    .input-wrap {
      display: flex; align-items: center;
      background: var(--bg-base); border: 1px solid var(--border-subtle);
      border-radius: 12px; overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(126,203,170,0.08);
    }

    .input-wrap input {
      flex: 1; padding: 14px 16px; background: transparent; border: none;
      color: var(--text-primary); font-family: inherit; font-size: 14px;
      outline: none;
    }

    .input-wrap input::placeholder { color: var(--text-muted); }

    .paste-btn {
      padding: 12px 16px; background: transparent; border: none;
      color: var(--text-muted); cursor: pointer; transition: color 0.2s;
      display: flex; align-items: center;
    }

    .paste-btn:hover, .paste-btn:active { color: var(--mint); }

    /* ── Button ── */
    .rip-btn {
      position: relative; width: 100%; padding: 16px;
      border: 1px solid var(--border-subtle); border-radius: 12px;
      font-family: 'Silkscreen', cursive; font-size: 15px; font-weight: 700;
      letter-spacing: 1px; cursor: pointer;
      transition: all 0.2s; overflow: hidden;
      background: var(--bg-raised); color: var(--text-muted);
    }

    .rip-btn:not(:disabled) {
      background: var(--mint); color: #0a0d12; border-color: var(--mint);
    }

    .rip-btn:not(:disabled):hover {
      background: #6dba99; box-shadow: 0 4px 20px rgba(126,203,170,0.3);
      transform: translateY(-1px);
    }

    .rip-btn:not(:disabled):active { transform: translateY(0) scale(0.99); }
    .rip-btn:disabled { cursor: default; }

    .rip-btn.loading .btn-text { opacity: 0; }
    .rip-btn.loading .spinner { display: block; }

    .spinner {
      display: none; position: absolute; top: 50%; left: 50%;
      width: 22px; height: 22px; margin: -11px 0 0 -11px;
      border: 2.5px solid rgba(10,13,18,0.3); border-top-color: #0a0d12;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status ── */
    .status {
      font-size: 12px; text-align: center; min-height: 18px;
      color: var(--text-secondary); line-height: 1.5;
    }

    .status.error { color: var(--red); }

    /* ── Results ── */
    .results {
      display: none; flex-direction: column; gap: 16px;
      animation: fadeUp 0.4s var(--ease) both;
    }

    .results.visible { display: flex; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .result-header {
      padding: 16px; background: var(--bg-base);
      border: 1px solid var(--border-subtle); border-radius: 12px;
    }

    .result-title {
      font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 4px;
    }

    .result-channel {
      font-size: 11px; color: var(--text-secondary);
    }

    .result-badge {
      display: inline-block; margin-top: 8px; padding: 2px 8px;
      font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
      border-radius: 6px; background: var(--mint-subtle); color: var(--mint);
    }

    .result-section {
      padding: 16px; background: var(--bg-base);
      border: 1px solid var(--border-subtle); border-radius: 12px;
    }

    .result-section h2 {
      font-family: 'Silkscreen', cursive; font-size: 12px;
      color: var(--mint); letter-spacing: 1px; margin-bottom: 12px;
    }

    .result-section .content {
      font-size: 13px; line-height: 1.7; color: var(--text-secondary);
    }

    .result-section .content p { margin-bottom: 8px; }
    .result-section .content p:last-child { margin-bottom: 0; }

    .result-section .content ul {
      list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px;
    }

    .result-section .content li {
      padding-left: 16px; position: relative;
    }

    .result-section .content li::before {
      content: ''; position: absolute; left: 0; top: 8px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--mint); opacity: 0.6;
    }

    /* ── Actions ── */
    .actions {
      display: flex; gap: 8px;
    }

    .action-btn {
      flex: 1; padding: 12px; background: var(--bg-base);
      border: 1px solid var(--border-subtle); border-radius: 10px;
      font-family: inherit; font-size: 11px; font-weight: 700;
      color: var(--text-secondary); cursor: pointer;
      transition: all 0.2s; text-align: center; letter-spacing: 0.5px;
    }

    .action-btn:hover { border-color: var(--border-active); color: var(--mint); }
    .action-btn:active { transform: scale(0.98); }

    /* ── Footer ── */
    .footer {
      margin-top: auto; padding-top: 12px;
      border-top: 1px solid rgba(126,203,170,0.04);
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--text-muted);
    }

    .footer a { color: var(--text-muted); text-decoration: none; }
    .footer a:hover { color: var(--mint); }

    /* ── Animations ── */
    .header { animation: fadeUp 0.4s var(--ease) both; }
    .input-wrap { animation: fadeUp 0.4s var(--ease) 0.06s both; }
    .rip-btn { animation: fadeUp 0.4s var(--ease) 0.12s both; }
    .footer { animation: fadeUp 0.4s var(--ease) 0.18s both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="crt" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="logo">🎬</div>
      <div class="brand">
        <h1>rippr</h1>
        <div class="tag">VIDEO SUMMARIZER</div>
      </div>
    </header>

    <div class="input-wrap">
      <input type="url" id="url" placeholder="Paste YouTube URL..." autocomplete="off" spellcheck="false" enterkeyhint="go">
      <button class="paste-btn" id="paste" title="Paste from clipboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
    </div>

    <button class="rip-btn" id="rip" disabled>
      <span class="btn-text">Paste a URL to start</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <div class="status" id="status" aria-live="polite"></div>

    <div class="results" id="results">
      <div class="result-header" id="result-header"></div>
      <div class="result-section" id="summary-section">
        <h2>Summary</h2>
        <div class="content" id="summary-content"></div>
      </div>
      <div class="result-section" id="points-section">
        <h2>Key Points</h2>
        <div class="content" id="points-content"></div>
      </div>
      <div class="result-section" id="takeaways-section">
        <h2>Takeaways</h2>
        <div class="content" id="takeaways-content"></div>
      </div>
      <div class="actions">
        <button class="action-btn" id="copy-btn">Copy Summary</button>
        <button class="action-btn" id="share-btn">Share</button>
        <button class="action-btn" id="new-btn">New Video</button>
      </div>
    </div>

    <footer class="footer">
      <span>v1.0.0</span>
      <a href="https://github.com/mrslbt/rippr" target="_blank" rel="noopener">github</a>
      <span>rip &middot; summarize &middot; learn</span>
    </footer>
  </div>

  <script>
    const $ = (s) => document.getElementById(s);
    const urlInput = $("url");
    const ripBtn = $("rip");
    const statusEl = $("status");
    const resultsEl = $("results");

    let lastResult = null;

    // Validate URL
    function isYouTubeUrl(str) {
      if (!str) return false;
      return /(?:youtube\.com\/(?:watch|embed|v|shorts)|youtu\.be\/|^[a-zA-Z0-9_-]{11}$)/.test(str.trim());
    }

    function updateButton() {
      const valid = isYouTubeUrl(urlInput.value);
      ripBtn.disabled = !valid;
      ripBtn.querySelector(".btn-text").textContent = valid ? "Summarize" : "Paste a URL to start";
    }

    urlInput.addEventListener("input", updateButton);

    // Paste button
    $("paste").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        urlInput.value = text;
        updateButton();
        if (isYouTubeUrl(text)) ripBtn.focus();
      } catch { /* clipboard denied */ }
    });

    // Submit on Enter
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !ripBtn.disabled) ripBtn.click();
    });

    // Main action
    ripBtn.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url || ripBtn.disabled) return;

      ripBtn.classList.add("loading");
      ripBtn.disabled = true;
      statusEl.textContent = "Extracting transcript...";
      statusEl.className = "status";
      resultsEl.classList.remove("visible");

      try {
        const resp = await fetch("/api/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });

        const data = await resp.json();

        if (!resp.ok) throw new Error(data.error || "Something went wrong");

        lastResult = data;
        renderResults(data);
        statusEl.textContent = "";
      } catch (e) {
        statusEl.textContent = e.message;
        statusEl.className = "status error";
      } finally {
        ripBtn.classList.remove("loading");
        updateButton();
      }
    });

    function renderResults(data) {
      // Header
      $("result-header").innerHTML = `
        <div class="result-title">${esc(data.title)}</div>
        <div class="result-channel">${esc(data.channel)}</div>
        ${data.isAuto ? '<span class="result-badge">auto-generated captions</span>' : ""}
      `;

      // Parse markdown-ish response
      const content = data.content || "";
      const sections = parseSections(content);

      $("summary-content").innerHTML = sections.summary || "<p>No summary available.</p>";
      $("points-content").innerHTML = sections.keyPoints || "<p>No key points found.</p>";

      if (sections.takeaways) {
        $("takeaways-section").style.display = "";
        $("takeaways-content").innerHTML = sections.takeaways;
      } else {
        $("takeaways-section").style.display = "none";
      }

      resultsEl.classList.add("visible");
    }

    function parseSections(md) {
      const result = { summary: "", keyPoints: "", takeaways: "" };

      // Split by ## headers
      const parts = md.split(/^##\s+/m).filter(Boolean);

      for (const part of parts) {
        const lines = part.trim().split("\n");
        const heading = lines[0].toLowerCase().trim();
        const body = lines.slice(1).join("\n").trim();

        if (heading.includes("summary")) {
          result.summary = mdToHtml(body);
        } else if (heading.includes("key") || heading.includes("point")) {
          result.keyPoints = mdToHtml(body);
        } else if (heading.includes("takeaway") || heading.includes("action")) {
          result.takeaways = mdToHtml(body);
        }
      }

      // Fallback: if no sections parsed, put everything in summary
      if (!result.summary && !result.keyPoints) {
        result.summary = mdToHtml(md);
      }

      return result;
    }

    function mdToHtml(text) {
      if (!text) return "";

      // Split into bullet items and paragraphs
      const lines = text.split("\n").filter((l) => l.trim());
      const bullets = [];
      const paragraphs = [];

      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith("- ") || trimmed.startsWith("* ") || /^\d+\.\s/.test(trimmed)) {
          bullets.push(trimmed.replace(/^[-*]\s+|^\d+\.\s+/, ""));
        } else {
          paragraphs.push(trimmed);
        }
      }

      let html = "";
      if (paragraphs.length) {
        html += paragraphs.map((p) => `<p>${esc(p)}</p>`).join("");
      }
      if (bullets.length) {
        html += "<ul>" + bullets.map((b) => `<li>${esc(b)}</li>`).join("") + "</ul>";
      }

      return html || `<p>${esc(text)}</p>`;
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    // Copy
    $("copy-btn").addEventListener("click", async () => {
      if (!lastResult) return;
      try {
        await navigator.clipboard.writeText(lastResult.content);
        $("copy-btn").textContent = "Copied!";
        setTimeout(() => ($("copy-btn").textContent = "Copy Summary"), 2000);
      } catch { /* denied */ }
    });

    // Share
    $("share-btn").addEventListener("click", async () => {
      if (!lastResult) return;
      const text = `${lastResult.title}\n\n${lastResult.content}`;
      if (navigator.share) {
        try {
          await navigator.share({ title: `rippr: ${lastResult.title}`, text });
        } catch { /* cancelled */ }
      } else {
        await navigator.clipboard.writeText(text);
        $("share-btn").textContent = "Copied!";
        setTimeout(() => ($("share-btn").textContent = "Share"), 2000);
      }
    });

    // New video
    $("new-btn").addEventListener("click", () => {
      urlInput.value = "";
      resultsEl.classList.remove("visible");
      lastResult = null;
      updateButton();
      urlInput.focus();
    });
  </script>
</body>
</html>

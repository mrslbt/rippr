<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>rippr — YouTube Transcript Ripper & Summarizer</title>
  <meta name="description" content="Rip YouTube transcripts for LLM use or get AI-powered summaries. Fast, free, mobile-friendly.">
  <meta name="theme-color" content="#0a0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #7ecbaa;
      --mint-glow: rgba(126,203,170,0.4);
      --mint-subtle: rgba(126,203,170,0.08);
      --mint-dim: rgba(126,203,170,0.15);
      --bg-deep: #0a0d12;
      --bg-base: #0d1117;
      --bg-raised: #141a22;
      --border-subtle: rgba(126,203,170,0.08);
      --border-active: rgba(126,203,170,0.2);
      --text-primary: #e6edf3;
      --text-secondary: #7d8590;
      --text-muted: #484f58;
      --red: #f85149;
      --green: #3fb950;
      --ease: cubic-bezier(0.16,1,0.3,1);
      --spring: cubic-bezier(0.34,1.56,0.64,1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Atmosphere ── */
    .crt {
      position: fixed; inset: 0; pointer-events: none; z-index: 100;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }
    .glow {
      position: fixed; top: -40%; left: -20%; width: 140%; height: 80%;
      background: radial-gradient(ellipse at 50% 0%, rgba(126,203,170,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* ── Layout ── */
    .app {
      position: relative; z-index: 1;
      max-width: 480px; margin: 0 auto;
      padding: 24px 20px env(safe-area-inset-bottom, 20px);
      display: flex; flex-direction: column; gap: 16px;
      min-height: 100dvh;
    }

    /* ── Header ── */
    .header { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-raised), var(--bg-base));
      border: 1px solid var(--border-active);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
      animation: bob 4s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .brand h1 {
      font-family: 'Silkscreen', cursive; font-size: 26px; font-weight: 700;
      letter-spacing: 1px; line-height: 1;
      text-shadow: 0 0 30px rgba(126,203,170,0.15);
    }
    .brand .tag {
      font-size: 9px; letter-spacing: 3px; color: var(--text-muted);
      text-transform: uppercase; margin-top: 4px;
    }

    /* ── URL Input ── */
    .input-wrap {
      display: flex; align-items: center;
      background: var(--bg-base); border: 1px solid var(--border-subtle);
      border-radius: 12px; overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap:focus-within {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(126,203,170,0.08);
    }
    .input-wrap input {
      flex: 1; padding: 14px 16px; background: transparent; border: none;
      color: var(--text-primary); font-family: inherit; font-size: 14px;
      outline: none;
    }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .icon-btn {
      padding: 12px 14px; background: transparent; border: none;
      color: var(--text-muted); cursor: pointer; transition: color 0.2s;
      display: flex; align-items: center;
    }
    .icon-btn:hover, .icon-btn:active { color: var(--mint); }

    /* ── Mode Tabs ── */
    .mode-tabs {
      display: flex; gap: 4px; padding: 4px;
      background: var(--bg-base); border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }
    .mode-tab {
      flex: 1; padding: 10px 0; border: none; border-radius: 9px;
      font-family: 'Silkscreen', cursive; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; cursor: pointer;
      background: transparent; color: var(--text-muted);
      transition: all 0.25s var(--ease);
    }
    .mode-tab.active {
      background: var(--mint-subtle); color: var(--mint);
      box-shadow: 0 0 12px rgba(126,203,170,0.08);
    }
    .mode-tab:not(.active):hover { color: var(--text-secondary); }

    /* ── Panels ── */
    .panel { display: none; flex-direction: column; gap: 12px; }
    .panel.active { display: flex; animation: fadeUp 0.3s var(--ease) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Format Presets (Rip mode) ── */
    .section-label {
      font-size: 11px; letter-spacing: 0.5px; color: var(--text-muted);
      font-style: italic; margin-bottom: -4px;
    }
    .presets { display: flex; flex-direction: column; gap: 5px; }
    .preset {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: var(--bg-base);
      border: 1px solid var(--border-subtle); border-radius: 10px;
      cursor: pointer; transition: all 0.2s var(--ease);
      font-family: inherit; color: var(--text-primary); text-align: left;
    }
    .preset:hover { border-color: var(--border-active); transform: translateX(3px); }
    .preset .dot {
      width: 8px; height: 8px; border-radius: 50%;
      border: 1.5px solid var(--text-muted); flex-shrink: 0;
      transition: all 0.2s var(--spring);
    }
    .preset .label { flex: 1; display: flex; align-items: baseline; gap: 8px; }
    .preset .name { font-size: 13px; font-weight: 700; color: var(--text-secondary); transition: color 0.2s; }
    .preset .ext { font-size: 11px; color: var(--text-muted); }
    .preset .badge {
      font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 6px; background: var(--mint-subtle);
      color: var(--mint); opacity: 0; transform: translateX(8px);
      transition: all 0.2s var(--ease);
    }
    .preset.active { border-color: var(--border-active); background: rgba(126,203,170,0.03); }
    .preset.active .dot { border-color: var(--mint); background: var(--mint); box-shadow: 0 0 8px var(--mint-glow); }
    .preset.active .name { color: var(--mint); }
    .preset.active .ext { color: #9dd5be; }
    .preset.active .badge { opacity: 1; transform: translateX(0); }

    /* ── Action Button ── */
    .action-btn-main {
      position: relative; width: 100%; padding: 16px;
      border: 1px solid var(--border-subtle); border-radius: 12px;
      font-family: 'Silkscreen', cursive; font-size: 15px; font-weight: 700;
      letter-spacing: 1px; cursor: pointer;
      transition: all 0.2s; overflow: hidden;
      background: var(--bg-raised); color: var(--text-muted);
    }
    .action-btn-main:not(:disabled) {
      background: var(--mint); color: #0a0d12; border-color: var(--mint);
    }
    .action-btn-main:not(:disabled):hover {
      background: #6dba99; box-shadow: 0 4px 20px rgba(126,203,170,0.3);
      transform: translateY(-1px);
    }
    .action-btn-main:not(:disabled):active { transform: translateY(0) scale(0.99); }
    .action-btn-main:disabled { cursor: default; }
    .action-btn-main.loading .btn-text { opacity: 0; }
    .action-btn-main.loading .spinner { display: block; }
    .action-btn-main.success { background: var(--green) !important; color: #fff !important; border-color: var(--green) !important; }
    .spinner {
      display: none; position: absolute; top: 50%; left: 50%;
      width: 22px; height: 22px; margin: -11px 0 0 -11px;
      border: 2.5px solid rgba(10,13,18,0.3); border-top-color: #0a0d12;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status ── */
    .status {
      font-size: 12px; text-align: center; min-height: 18px;
      color: var(--text-secondary); line-height: 1.5;
    }
    .status.error { color: var(--red); }

    /* ── Summary Results ── */
    .results {
      display: none; flex-direction: column; gap: 14px;
      animation: fadeUp 0.4s var(--ease) both;
    }
    .results.visible { display: flex; }

    .result-header {
      padding: 14px 16px; background: var(--bg-base);
      border: 1px solid var(--border-subtle); border-radius: 12px;
    }
    .result-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; }
    .result-channel { font-size: 11px; color: var(--text-secondary); }
    .result-badge {
      display: inline-block; margin-top: 8px; padding: 2px 8px;
      font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
      border-radius: 6px; background: var(--mint-subtle); color: var(--mint);
    }

    .result-section {
      padding: 14px 16px; background: var(--bg-base);
      border: 1px solid var(--border-subtle); border-radius: 12px;
    }
    .result-section h2 {
      font-family: 'Silkscreen', cursive; font-size: 12px;
      color: var(--mint); letter-spacing: 1px; margin-bottom: 10px;
    }
    .result-section .content {
      font-size: 13px; line-height: 1.7; color: var(--text-secondary);
    }
    .result-section .content p { margin-bottom: 8px; }
    .result-section .content p:last-child { margin-bottom: 0; }
    .result-section .content ul {
      list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px;
    }
    .result-section .content li { padding-left: 16px; position: relative; }
    .result-section .content li::before {
      content: ''; position: absolute; left: 0; top: 8px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--mint); opacity: 0.6;
    }

    /* ── Bottom Actions ── */
    .bottom-actions { display: flex; gap: 8px; }
    .btn-sm {
      flex: 1; padding: 11px 8px; background: var(--bg-base);
      border: 1px solid var(--border-subtle); border-radius: 10px;
      font-family: inherit; font-size: 11px; font-weight: 700;
      color: var(--text-secondary); cursor: pointer;
      transition: all 0.2s; text-align: center; letter-spacing: 0.3px;
    }
    .btn-sm:hover { border-color: var(--border-active); color: var(--mint); }
    .btn-sm:active { transform: scale(0.98); }

    /* ── Footer ── */
    .footer {
      margin-top: auto; padding-top: 12px;
      border-top: 1px solid rgba(126,203,170,0.04);
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--text-muted);
    }
    .footer a { color: var(--text-muted); text-decoration: none; }
    .footer a:hover { color: var(--mint); }

    /* ── Entry Animations ── */
    .header { animation: fadeUp 0.4s var(--ease) both; }
    .input-wrap { animation: fadeUp 0.4s var(--ease) 0.04s both; }
    .mode-tabs { animation: fadeUp 0.4s var(--ease) 0.08s both; }
    .panel { animation: fadeUp 0.4s var(--ease) 0.12s both; }
    .footer { animation: fadeUp 0.4s var(--ease) 0.16s both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="crt" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo"><img src="/icon.png" alt="rippr" width="52" height="52" style="border-radius:14px;display:block;"></div>
      <div class="brand">
        <h1>rippr</h1>
        <div class="tag">TRANSCRIPT RIPPER</div>
      </div>
    </header>

    <!-- URL Input -->
    <div class="input-wrap">
      <input type="url" id="url" placeholder="Paste YouTube URL..." autocomplete="off" spellcheck="false" enterkeyhint="go">
      <button class="icon-btn" id="paste" title="Paste from clipboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
    </div>

    <!-- Mode Tabs -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="rip">Rip</button>
      <button class="mode-tab" data-mode="summarize">Summarize</button>
    </div>

    <!-- ═══ RIP Panel ═══ -->
    <div class="panel active" id="panel-rip">
      <span class="section-label">// output_format</span>
      <div class="presets">
        <button class="preset active" data-format="txt">
          <span class="dot"></span>
          <div class="label"><span class="name">RAG</span><span class="ext">.txt</span></div>
          <span class="badge">default</span>
        </button>
        <button class="preset" data-format="json">
          <span class="dot"></span>
          <div class="label"><span class="name">Structured</span><span class="ext">.json</span></div>
          <span class="badge">default</span>
        </button>
        <button class="preset" data-format="md">
          <span class="dot"></span>
          <div class="label"><span class="name">Readable</span><span class="ext">.md</span></div>
          <span class="badge">default</span>
        </button>
      </div>

      <button class="action-btn-main" id="rip-btn" disabled>
        <span class="btn-text">Paste a URL to start</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </div>

    <!-- ═══ SUMMARIZE Panel ═══ -->
    <div class="panel" id="panel-summarize">
      <button class="action-btn-main" id="sum-btn" disabled>
        <span class="btn-text">Paste a URL to start</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Status -->
    <div class="status" id="status" aria-live="polite"></div>

    <!-- Summary Results -->
    <div class="results" id="results">
      <div class="result-header" id="result-header"></div>
      <div class="result-section" id="summary-section">
        <h2>Summary</h2>
        <div class="content" id="summary-content"></div>
      </div>
      <div class="result-section" id="points-section">
        <h2>Key Points</h2>
        <div class="content" id="points-content"></div>
      </div>
      <div class="result-section" id="takeaways-section">
        <h2>Takeaways</h2>
        <div class="content" id="takeaways-content"></div>
      </div>
      <div class="bottom-actions">
        <button class="btn-sm" id="copy-btn">Copy</button>
        <button class="btn-sm" id="share-btn">Share</button>
        <button class="btn-sm" id="new-btn">New</button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
      <a href="https://github.com/mrslbt/rippr" target="_blank" rel="noopener">github</a>
      <span>rip &middot; feed &middot; learn</span>
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const urlInput = $("url");
    const ripBtn = $("rip-btn");
    const sumBtn = $("sum-btn");
    const statusEl = $("status");
    const resultsEl = $("results");

    let currentMode = "rip";
    let selectedFormat = "txt";
    let lastResult = null;

    // ── URL validation ──
    function isYT(str) {
      return str && /(?:youtube\.com\/(?:watch|embed|v|shorts)|youtu\.be\/|^[a-zA-Z0-9_-]{11}$)/.test(str.trim());
    }

    function updateButtons() {
      const valid = isYT(urlInput.value);
      ripBtn.disabled = !valid;
      sumBtn.disabled = !valid;
      ripBtn.querySelector(".btn-text").textContent = valid ? "Rip Transcript" : "Paste a URL to start";
      sumBtn.querySelector(".btn-text").textContent = valid ? "Summarize" : "Paste a URL to start";
    }

    urlInput.addEventListener("input", updateButtons);

    // ── Paste button ──
    $("paste").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        urlInput.value = text;
        updateButtons();
        if (isYT(text)) {
          if (currentMode === "rip") ripBtn.focus();
          else sumBtn.focus();
        }
      } catch {}
    });

    // ── Enter key ──
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (currentMode === "rip" && !ripBtn.disabled) ripBtn.click();
        else if (currentMode === "summarize" && !sumBtn.disabled) sumBtn.click();
      }
    });

    // ── Mode tabs ──
    document.querySelectorAll(".mode-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        currentMode = tab.dataset.mode;
        document.querySelectorAll(".mode-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        $("panel-" + currentMode).classList.add("active");
        resultsEl.classList.remove("visible");
        statusEl.textContent = "";
        statusEl.className = "status";
      });
    });

    // ── Format presets ──
    document.querySelectorAll(".preset").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".preset").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedFormat = btn.dataset.format;
      });
    });

    // ── RIP action ──
    ripBtn.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) return;

      ripBtn.classList.add("loading");
      ripBtn.disabled = true;
      statusEl.textContent = "Extracting transcript...";
      statusEl.className = "status";
      resultsEl.classList.remove("visible");

      try {
        const resp = await fetch("/api/rip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "Something went wrong");

        const output = buildOutput(data, selectedFormat);
        const ext = selectedFormat;
        const filename = sanitize(data.title) + "." + ext;

        downloadFile(output, filename);

        statusEl.textContent = `Downloaded ${filename}`;
        statusEl.className = "status";
        ripBtn.classList.add("success");
        ripBtn.querySelector(".btn-text").textContent = "Downloaded!";
        setTimeout(() => {
          ripBtn.classList.remove("success");
          updateButtons();
        }, 2000);
      } catch (e) {
        statusEl.textContent = e.message;
        statusEl.className = "status error";
      } finally {
        ripBtn.classList.remove("loading");
        if (!ripBtn.classList.contains("success")) updateButtons();
      }
    });

    // ── SUMMARIZE action ──
    sumBtn.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) return;

      sumBtn.classList.add("loading");
      sumBtn.disabled = true;
      statusEl.textContent = "Summarizing...";
      statusEl.className = "status";
      resultsEl.classList.remove("visible");

      try {
        const resp = await fetch("/api/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "Something went wrong");

        lastResult = data;
        renderSummary(data);
        statusEl.textContent = "";
      } catch (e) {
        statusEl.textContent = e.message;
        statusEl.className = "status error";
      } finally {
        sumBtn.classList.remove("loading");
        updateButtons();
      }
    });

    // ── Build output (mirrors extension shared.js) ──
    function buildOutput(data, format) {
      const { title, channel, language, videoUrl, segments } = data;

      if (format === "json") {
        return JSON.stringify({
          title, channel, url: videoUrl, language,
          segments: segments.map((s) => ({ start: s.start, duration: s.duration, text: s.text })),
          fullText: segments.map((s) => s.text).join(" "),
        }, null, 2);
      }

      const lines = [];
      if (format === "md") {
        lines.push("# " + title, "");
        lines.push("**Channel:** " + channel);
        lines.push("**URL:** " + videoUrl);
        lines.push("**Language:** " + language, "", "---", "");
      } else {
        lines.push("Title: " + title);
        lines.push("Channel: " + channel);
        lines.push("URL: " + videoUrl);
        lines.push("Language: " + language, "", "---", "");
      }

      for (const seg of segments) lines.push(seg.text);

      let output = lines.join("\n");

      // RAG: join body into single block
      if (format === "txt") {
        const parts = output.split("---\n\n");
        if (parts.length === 2) {
          const body = parts[1].split("\n").filter((l) => l.trim());
          output = parts[0] + "---\n\n" + body.join(" ");
        }
      }

      return output;
    }

    function sanitize(name) {
      return name.replace(/[<>:"/\\|?*]+/g, "").trim().substring(0, 200);
    }

    function downloadFile(content, filename) {
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    // ── Render summary ──
    function renderSummary(data) {
      $("result-header").innerHTML =
        '<div class="result-title">' + esc(data.title) + '</div>' +
        '<div class="result-channel">' + esc(data.channel) + '</div>' +
        (data.isAuto ? '<span class="result-badge">auto-generated captions</span>' : "");

      const sections = parseSections(data.content || "");
      $("summary-content").innerHTML = sections.summary || "<p>No summary available.</p>";
      $("points-content").innerHTML = sections.keyPoints || "<p>No key points found.</p>";

      if (sections.takeaways) {
        $("takeaways-section").style.display = "";
        $("takeaways-content").innerHTML = sections.takeaways;
      } else {
        $("takeaways-section").style.display = "none";
      }

      resultsEl.classList.add("visible");
    }

    function parseSections(md) {
      const result = { summary: "", keyPoints: "", takeaways: "" };
      const parts = md.split(/^##\s+/m).filter(Boolean);
      for (const part of parts) {
        const lines = part.trim().split("\n");
        const h = lines[0].toLowerCase().trim();
        const body = lines.slice(1).join("\n").trim();
        if (h.includes("summary")) result.summary = mdToHtml(body);
        else if (h.includes("key") || h.includes("point")) result.keyPoints = mdToHtml(body);
        else if (h.includes("takeaway") || h.includes("action")) result.takeaways = mdToHtml(body);
      }
      if (!result.summary && !result.keyPoints) result.summary = mdToHtml(md);
      return result;
    }

    function mdToHtml(text) {
      if (!text) return "";
      const lines = text.split("\n").filter((l) => l.trim());
      const bullets = [], paragraphs = [];
      for (const line of lines) {
        const t = line.trim();
        if (t.startsWith("- ") || t.startsWith("* ") || /^\d+\.\s/.test(t))
          bullets.push(t.replace(/^[-*]\s+|^\d+\.\s+/, ""));
        else paragraphs.push(t);
      }
      let html = "";
      if (paragraphs.length) html += paragraphs.map((p) => "<p>" + esc(p) + "</p>").join("");
      if (bullets.length) html += "<ul>" + bullets.map((b) => "<li>" + esc(b) + "</li>").join("") + "</ul>";
      return html || "<p>" + esc(text) + "</p>";
    }

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    // ── Bottom actions ──
    $("copy-btn").addEventListener("click", async () => {
      if (!lastResult) return;
      try {
        await navigator.clipboard.writeText(lastResult.content);
        $("copy-btn").textContent = "Copied!";
        setTimeout(() => ($("copy-btn").textContent = "Copy"), 2000);
      } catch {}
    });

    $("share-btn").addEventListener("click", async () => {
      if (!lastResult) return;
      const text = lastResult.title + "\n\n" + lastResult.content;
      if (navigator.share) {
        try { await navigator.share({ title: "rippr: " + lastResult.title, text }); } catch {}
      } else {
        await navigator.clipboard.writeText(text);
        $("share-btn").textContent = "Copied!";
        setTimeout(() => ($("share-btn").textContent = "Share"), 2000);
      }
    });

    $("new-btn").addEventListener("click", () => {
      urlInput.value = "";
      resultsEl.classList.remove("visible");
      lastResult = null;
      statusEl.textContent = "";
      statusEl.className = "status";
      updateButtons();
      urlInput.focus();
    });
  </script>
</body>
</html>
